# Animagine XL 단독 한 장 시험 설정입니다.
model:
  family: sdxl
  id: cagliostrolab/animagine-xl-3.1
  cache_dir: D:/genai-cache/huggingface
  dtype: float16

generation:
  mode: image_to_image
  width: 768
  height: 1344
  steps: 28
  guidance_scale: 5.5
  original_image_change_strength: 0.25
  limit: 1
  default_negative_prompt: >-
    nsfw, lowres, bad, text, error, extra digits, missing fingers,
    worst quality, low quality, watermark, signature, unfinished,
    different character, different character design,
    different hairstyle, different hair color, different eye color,
    different outfit, mismatched colors, missing character features,
    bad anatomy, bad hands, malformed hands, fused fingers, extra fingers,
    uneven eyes, asymmetrical eyes, missing pupils, deformed pupils,
    unnatural clothing folds, warped clothing

reference_quality:
  enabled: true
  minimum_short_side: 512
  minimum_sharpness_score: 120.0
  model_path: D:/genai-cache/models/RealESRGAN_x4plus_anime_6B.pth
  tile_size: 256
  tile_overlap: 16
  maximum_long_side: 2048

clothing_preparation:
  detector_model_id: IDEA-Research/grounding-dino-tiny
  cache_dir: D:/genai-cache/huggingface
  inference_device: cpu
  box_threshold: 0.30
  text_threshold: 0.25
  minimum_area_ratio: 0.02
  maximum_area_ratio: 0.95

clothing_mask_extraction:
  model_id: facebook/sam2.1-hiera-tiny
  cache_dir: D:/genai-cache/huggingface
  inference_device: cpu
  maximum_candidate_count: 3
  maximum_region_count: 8
  alpha_empty_probability: 0.01
  alpha_solid_probability: 0.99

clothing_pixel_extraction:
  maximum_hole_area_pixels: 4096
  maximum_hole_area_ratio: 0.0025
  maximum_rgb_distance: 36.0
  white_clothing_luminance: 200.0
  maximum_white_luminance_difference: 48.0

clothing_design_analysis:
  model_id: SmilingWolf/wd-vit-tagger-v3
  cache_dir: D:/genai-cache/huggingface
  model_filename: model.onnx
  label_filename: selected_tags.csv
  execution_provider: CPUExecutionProvider
  score_threshold: 0.35
  maximum_tag_count: 30

character_body_comparison:
  python_executable: D:/genai-cache/catvton-venv/Scripts/python.exe
  repository_path: D:/genai-cache/tools/CatVTON
  runner_path: scripts/body_comparison_runner.py
  temporary_root: D:/genai-cache/temp/body-comparison
  cache_dir: D:/genai-cache/huggingface
  width: 576
  height: 1024
  timeout_seconds: 1800
  mask_expansion_ratio: 0.01
  minimum_mask_expansion_pixels: 5
  maximum_mask_expansion_pixels: 15
  mask_closing_radius_pixels: 2
  foreground_model_id: isnet-anime
  foreground_expansion_pixels: 15

pose_reference_estimation:
  python_executable: D:/genai-cache/catvton-venv/Scripts/python.exe
  runner_path: scripts/pose_reference_runner.py
  temporary_root: D:/genai-cache/temp/pose-reference
  cache_dir: D:/genai-cache/huggingface
  timeout_seconds: 600
  pose_device: cpu
  minimum_pose_confidence: 0.30

# DWPose 실패·품질 미달 때 마지막 사용자 승인 자세를 재승인 후 사용한다.
pose_fallback:
  enabled: true
  library_root: D:/genai-cache/genai-lab/approved-poses
  default_pose_id: last-approved
  minimum_detected_joint_count: 8
  require_shoulder: true
  require_hip: true
  require_knee: true
  require_ankle: true
  require_user_approval: true

pose_control:
  enabled: true
  model_id: xinsir/controlnet-openpose-sdxl-1.0
  conditioning_scale: 0.65
  guidance_start: 0.00
  guidance_end: 0.80
  original_image_change_strength: 0.35

# 실제 결과 3건을 먼저 확보하는 임시 관측 전용 정책이다.
# 자세 일치 품질은 기록만 하며 생성·의상 합성을 추가로 차단하지 않는다.
pose_result_policy:
  mode: observe_only
  target_sample_count: 3
  block_on_pose_mismatch: false
  switch_to_text_to_image: false
  use_identity_crop: false

clothing_try_on:
  enabled: true
  safety_check_enabled: false
  python_executable: D:/genai-cache/catvton-venv/Scripts/python.exe
  repository_path: D:/genai-cache/tools/CatVTON
  runner_path: scripts/catvton_runner.py
  temporary_root: D:/genai-cache/temp/catvton
  cache_dir: D:/genai-cache/huggingface
  model_id: zhengchong/CatVTON
  base_model_id: booksforcharlie/stable-diffusion-inpainting
  width: 576
  height: 1024
  inference_steps: 30
  guidance_scale: 2.5
  mask_blur_factor: 9
  mixed_precision: bf16
  timeout_seconds: 1800
  mask_expansion_ratio: 0.01
  mask_expansion_min_pixels: 5
  mask_expansion_max_pixels: 15
  mask_closing_radius: 2

garment_inpaint:
  enabled: true
  python_executable: D:/genai-cache/venv/Scripts/python.exe
  runner_path: scripts/garment_inpaint_runner.py
  temporary_root: D:/genai-cache/temp/garment-inpaint
  benchmark_root: outputs/debug_benchmark
  cache_dir: D:/genai-cache/huggingface
  base_model_id: diffusers/stable-diffusion-xl-1.0-inpainting-0.1
  model_variant: fp16
  adapter_repository: h94/IP-Adapter
  adapter_subfolder: sdxl_models
  adapter_weight: ip-adapter-plus_sdxl_vit-h.safetensors
  adapter_image_encoder_subfolder: models/image_encoder
  strength: 0.90
  inference_steps: 28
  guidance_scale: 5.5
  ip_adapter_scale: 0.80
  padding_mask_crop: 64
  mask_threshold: 128
  garment_board_size: 1024
  garment_board_outer_padding: 32
  garment_board_cell_padding: 16
  garment_board_minimum_component_pixels: 16
  garment_board_maximum_components: 8
  timeout_seconds: 1800
  dtype: float16


detail_correction:
  enabled: true
  detector_repository: Bingsu/adetailer
  face_model: face_yolov8s.pt
  hand_model: hand_yolov8n.pt
  minimum_confidence: 0.30
  maximum_face_regions: 1
  maximum_hand_regions: 2
  mask_padding_ratio: 0.20
  minimum_mask_area_ratio: 0.0002
  maximum_mask_area_ratio: 0.12
  inpaint_strength: 0.30
  inpaint_steps: 12
  guidance_scale: 5.5
  padding_mask_crop: 64

style:
  enabled: true
  reference_image: inputs/reference/style.png
  adapter_repository: h94/IP-Adapter
  adapter_subfolder: sdxl_models
  adapter_weight: ip-adapter_sdxl.bin
  scale: 0.80

paths:
  prompts_file: inputs/prompts_animagine.csv
  output_dir: outputs
